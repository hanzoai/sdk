[package]
name = "hanzo-sdk"
version = "0.1.0"
edition = "2021"
authors = ["Hanzo AI"]
license = "MIT"
description = "Hanzo AI SDK - Rust implementation"

[lib]
crate-type = ["cdylib", "rlib"]
name = "hanzo"

[[bin]]
name = "hanzo"
path = "src/bin/cli.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
url = "2.5"

# For Node.js bindings
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
napi = { version = "2.15", features = ["async", "serde-json"] }
napi-derive = "2.15"

[build-dependencies]
napi-build = "2.1"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1