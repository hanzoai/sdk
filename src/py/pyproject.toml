[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hanzo"
version = "0.1.0"
description = "Unified Hanzo AI SDK and CLI"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Hanzo AI", email = "dev@hanzo.ai"},
]
keywords = ["ai", "llm", "sdk", "cli", "hanzo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "httpx>=0.24",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "typer>=0.9",
    "uvloop>=0.17; platform_system != 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

agent = [
    "openai>=1.0",
    "anthropic>=0.30",
    "langchain>=0.1",
]

mcp = [
    "anyio>=3.0",
    "jsonrpc>=1.0",
]

[project.scripts]
hanzo = "hanzo.cli:main"

[project.urls]
Homepage = "https://hanzo.ai"
Documentation = "https://docs.hanzo.ai"
Repository = "https://github.com/hanzoai/sdk"
Issues = "https://github.com/hanzoai/sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["hanzo"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true