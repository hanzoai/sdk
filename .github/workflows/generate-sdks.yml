name: Generate SDKs
# Spec-driven client generation (gen/) — every language from the unified spec.
on:
  push: { branches: [main], paths: ['gen/**'] }
  pull_request: { paths: ['gen/**'] }
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # weekly resync with the openapi spec
concurrency: { group: gen-${{ github.ref }}, cancel-in-progress: true }
jobs:
  generate:
    name: Generate (${{ matrix.lang }})
    runs-on: hanzo-build-linux-amd64
    strategy:
      fail-fast: false
      matrix: { lang: [typescript, go, python, rust, java, kotlin, ruby, php, csharp, swift] }
    defaults: { run: { working-directory: gen } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4     # openapi-generator is a JVM tool
        with: { distribution: temurin, java-version: 21 }
      - name: Fetch unified spec (private openapi)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.UNIVERSE_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: make spec
      - run: LANGS="${{ matrix.lang }}" ./scripts/generate.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hanzo-sdk-${{ matrix.lang }}
          path: gen/clients/${{ matrix.lang }}
          if-no-files-found: error
